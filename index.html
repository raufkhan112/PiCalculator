<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Calculator & Budget Buddy</title>
    <script src="https://minepi.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            direction: ltr;
            text-align: left;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h2, h3 { color: #e94560; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            font-size: 1em;
        }
        input { background: #0f3460; color: white; }
        button {
            background-color: #e94560;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #ff6b81; }
        .clear-btn { background-color: #4e4e50; margin-top: 5px; }
        .clear-btn:hover { background-color: #6e6e70; }
        .result {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            border-left: 5px solid #e94560;
        }
        ul { list-style: none; padding: 0; }
        li { background: #0f3460; padding: 12px; margin: 8px 0; border-radius: 5px; display: flex; justify-content: space-between; }
        hr { border: 0; height: 1px; background: #e94560; margin: 25px 0; }
        .auth-box { background: #0f3460; padding: 10px; text-align: center; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pi Calculator & Budget Buddy</h2>
    
    <div id="authStatus" class="auth-box">Connecting to Pi Network...</div>

    <!-- Pi Section -->
    <label for="piAmount">Your Pi Balance:</label>
    <input type="number" id="piAmount" placeholder="e.g. 100">

    <label for="piPrice">Pi Price (USD):</label>
    <input type="number" id="piPrice" placeholder="e.g. 0.50">

    <button onclick="calculatePi()">Calculate Total Value</button>

    <div class="result" id="piResult">Total Value: $0.00</div>

    <hr>

    <!-- Expenses Section -->
    <h3>Daily Expense Tracker</h3>
    <label for="expName">Expense Name:</label>
    <input type="text" id="expName" placeholder="e.g. Internet Data">

    <label for="expCost">Amount (USD):</label>
    <input type="number" id="expCost" placeholder="e.g. 5">

    <button onclick="addExpense()">Add Expense</button>

    <h4>Expense List:</h4>
    <ul id="expenseList"></ul>
    <button onclick="clearExpenses()" class="clear-btn">Clear All Expenses</button>
</div>

<script>
    const Pi = window.Pi || null;
    if (Pi) {
        try {
            Pi.init({ version: "2.0", sandbox: true });
        } catch(e) {
            console.log("Pi init error");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadExpenses();
        authPiUser();
    });

    async function authPiUser() {
        const statusBox = document.getElementById('authStatus');
        if (Pi) {
            try {
                const scopes = ['username'];
                const auth = await Pi.authenticate(scopes, () => {});
                statusBox.innerText = `Welcome, ${auth.user.username}! ✨`;
                statusBox.style.color = "#00ffcc";
            } catch (error) {
                statusBox.innerText = "Logged in as Guest (Open in Pi Browser)";
                statusBox.style.color = "#ffcc00";
            }
        } else {
            statusBox.innerText = "Logged in as Guest (Local Mode)";
            statusBox.style.color = "#ffcc00";
        }
    }

    function calculatePi() {
        const amount = document.getElementById('piAmount').value || 0;
        const price = document.getElementById('piPrice').value || 0;
        const total = amount * price;
        document.getElementById('piResult').innerText = `Total Value: $${total.toFixed(2)}`;
    }

    function addExpense() {
        const name = document.getElementById('expName').value;
        const cost = document.getElementById('expCost').value;
        if(name === '' || cost === '') return;

        const expense = { name, cost: parseFloat(cost).toFixed(2) };
        let expenses = localStorage.getItem('expenses') ? JSON.parse(localStorage.getItem('expenses')) : [];
        expenses.push(expense);
        localStorage.setItem('expenses', JSON.stringify(expenses));

        renderExpenses();
        document.getElementById('expName').value = '';
        document.getElementById('expCost').value = '';
    }

    function loadExpenses() {
        renderExpenses();
    }

    function renderExpenses() {
        const list = document.getElementById('expenseList');
        list.innerHTML = '';
        let expenses = localStorage.getItem('expenses') ? JSON.parse(localStorage.getItem('expenses')) : [];
        expenses.forEach(exp => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${exp.name}:</span> <span>$${exp.cost}</span>`;
            list.appendChild(li);
        });
    }

    function clearExpenses() {
        localStorage.removeItem('expenses');
        renderExpenses();
    }
</script>

</body>
</html>
